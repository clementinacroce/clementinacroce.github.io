<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clementina Crocè</title>

  <style>
    body {
      margin: 0;
      background: #fafaf8;
      color: #252525;
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
    }

    main {
      max-width: 780px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 36px;
      align-items: start;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: normal;
      line-height: 1.2;
      margin: 0 0 28px;
    }

    p {
      margin: 0 0 22px;
    }

    .portrait {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 4px;
    }

    a {
      color: #245675;
      text-underline-offset: 4px;
    }

    nav {
      display: flex;
      gap: 28px;
      margin-top: 30px;
    }

    @media (max-width: 480px) {
      main {
        margin: 40px auto;
        padding: 0 20px;
      }

      .intro {
        grid-template-columns: minmax(0, 1fr) 90px;
        gap: 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="intro">
      <div>
        <h1>Clementina Crocè</h1>

        <p>
          I am an applied economist and a postdoctoral researcher
          at the University of Padua.
        </p>

        <p>
          My research interests include labor economics,
          the economics of education, gender economics,
          and development economics.
        </p>

        <nav aria-label="Contact and CV">
          <a href="cv.pdf">CV</a>
          <a href="mailto:clementina.croce@unipd.it">Email</a>
        </nav>
      </div>

      <img class="portrait"
           src="Foto_Clementina_Crocè.jpg"
           alt="Clementina Crocè">
    </div>
  </main>
</body>
</html>
